services:
  # 1. 프론트엔드 컨테이너 (React + Nginx)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: news-ai-web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - app-network
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-var:/var/www/certbot:ro

  # 2. 백엔드 컨테이너 (Spring Boot API)
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: news-ai-api
    restart: always
    expose:
      - "8080"
    ports:
      - "8080:8080"
    depends_on:
      - redis
    networks:
      - app-network
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - OLLAMA_API_URL=${OLLAMA_API_URL}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_MODEL_NAME=${OLLAMA_MODEL_NAME}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. 인메모리 캐시 컨테이너 (Redis)
  redis:
    image: redis:alpine
    container_name: news-ai-redis
    restart: always
    networks:
      - app-network
    ports:
      - "6379:6379"

  # 4. SSL 자동 갱신 컨테이너 (Certbot)
  certbot:
    image: certbot/certbot
    container_name: news-ai-certbot
    restart: always
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit 0; SIGTERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  app-network:
    driver: bridge

volumes:
  certbot-var:
