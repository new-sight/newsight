user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    access_log          /var/log/nginx/access.log;
    error_log           /var/log/nginx/error.log;

    # HTTP Server: Certbot 검증용 제외 모든 요청을 HTTPS(443)로 자동 301 리다이렉트
    server {
        listen 80;
        server_name newsight.o-r.kr butterflyeffect.o-r.kr localhost _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server (SSL 정식 연동)
    server {
        listen 443 ssl;
        server_name newsight.o-r.kr butterflyeffect.o-r.kr localhost _;

        # Let's Encrypt 정식 SSL 인증서 경로 (newsight.o-r.kr 도메인)
        ssl_certificate     /etc/letsencrypt/live/newsight.o-r.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/newsight.o-r.kr/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # React SPA 정적 라우팅
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 백엔드 API (Docker Bridge 네트워크를 통한 http://api:8080 리버스 프록시)
        location /api/ {
            proxy_pass          http://api:8080/api/;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }
    }
}
