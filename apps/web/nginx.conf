user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    access_log          /var/log/nginx/access.log;
    error_log           /var/log/nginx/error.log;

    # HTTP Server: Certbot Acme Challenge 및 HTTPS 리다이렉트 / Nginx 기본 서빙
    server {
        listen 80;
        server_name butterflyeffect.o-r.kr localhost _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # React SPA 정적 파일 서빙
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 백엔드 API (Docker Bridge 네트워크를 통한 api 컨테이너 http://api:8080 리버스 프록시)
        location /api/ {
            proxy_pass          http://api:8080/api/;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS Server (SSL 발급 후 연동)
    server {
        listen 443 ssl;
        server_name butterflyeffect.o-r.kr localhost _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # React SPA 정적 라우팅
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 백엔드 API (Docker Bridge 네트워크를 통한 http://api:8080 리버스 프록시)
        location /api/ {
            proxy_pass          http://api:8080/api/;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }
    }
}
